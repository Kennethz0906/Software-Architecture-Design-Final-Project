<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - Library System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 400px;">
    <div class="card">
        <div class="card-header">
            <h3 class="text-center">Library Login</h3>
        </div>
        <div class="card-body">
            <div th:if="${param.error}" class="alert alert-danger">Invalid email or password</div>
            <div th:if="${param.logout}" class="alert alert-info">You have been logged out</div>
            <div th:if="${param.registered}" class="alert alert-success">Registration successful! Please login</div>
            
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
            <div class="text-center mt-3">
                <a th:href="@{/register}">Don't have an account? Register</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
