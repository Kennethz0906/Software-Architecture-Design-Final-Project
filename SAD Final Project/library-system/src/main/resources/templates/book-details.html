<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${book.title} + ' - Details'">Book Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/books">📚 Library System</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/borrow/history">My Books</a>
            <form th:action="@{/logout}" method="post" style="display: inline;">
                <button type="submit" class="nav-link btn btn-link" style="display: inline; padding: 0; border: none; background: none; color: rgba(255,255,255,.5);">
                    Logout
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    
    <div class="card">
        <div class="card-header">
            <h3 th:text="${book.title}">Book Title</h3>
        </div>
        <div class="card-body">
            <p><strong>Author:</strong> <span th:text="${book.author}"/></p>
            <p><strong>ISBN:</strong> <span th:text="${book.isbn}"/></p>
            <p><strong>Genre:</strong> <span th:text="${book.genre}"/></p>
            <p><strong>Total Copies:</strong> <span th:text="${book.totalCopies}"/></p>
            <p><strong>Available Copies:</strong> <span th:text="${book.availableCopies}"/></p>
            
            <div th:if="${book.availableCopies > 0}">
                <a th:href="@{/borrow/{id}(id=${book.id})}" class="btn btn-success">Borrow This Book</a>
            </div>
            <div th:unless="${book.availableCopies > 0}">
                <button class="btn btn-secondary" disabled>Currently Unavailable</button>
            </div>
            <a href="/books" class="btn btn-outline-secondary ms-2">Back to Catalog</a>
        </div>
    </div>
</div>
</body>
</html>
