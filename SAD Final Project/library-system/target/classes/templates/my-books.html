<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Borrowed Books</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/books">📚 Library System</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/books">Browse Books</a>
            <form th:action="@{/logout}" method="post" style="display: inline;">
                <button type="submit" class="nav-link btn btn-link" style="display: inline; padding: 0; border: none; background: none; color: rgba(255,255,255,.5);">
                Logout
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2>My Borrowing History</h2>
    
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Book</th>
                <th>Borrowed</th>
                <th>Due Date</th>
                <th>Returned</th>
                <th>Status</th>
                <th>Fine</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="record : ${records}">
                <td th:text="${record.book.title}">Book Title</td>
                <td th:text="${record.borrowDate}">2024-01-01</td>
                <td th:text="${record.dueDate}">2024-01-15</td>
                <td th:text="${record.returnDate}">-</td>
                <td>
                    <span th:if="${record.status == 'BORROWED'}" class="badge bg-warning">Borrowed</span>
                    <span th:if="${record.status == 'RETURNED'}" class="badge bg-success">Returned</span>
                    <span th:if="${record.status == 'OVERDUE'}" class="badge bg-danger">Overdue</span>
                </td>
                <td th:text="${record.fineAmount}">$0.00</td>
                <td>
                    <a th:if="${record.status == 'BORROWED'}" th:href="@{/borrow/return/{id}(id=${record.id})}" class="btn btn-sm btn-primary">Return</a>
                </td>
            </tr>
        </tbody>
    </table>
    
    <div th:if="${records.isEmpty()}" class="alert alert-info">
        You haven't borrowed any books yet. <a href="/books">Browse the catalog</a>
    </div>
</div>
</body>
</html>
